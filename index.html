<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OffiSuite</title>
  <!-- 3秒後に Nexis_OffiSuite.html へ自動移動 -->
  <meta http-equiv="refresh" content="3; url=Nexis_OffiSuite.html">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* ふんわり表示されて少し大きくなるアニメーション */
    .logo {
      font-size: 3rem;
      font-weight: bold;
      opacity: 0;
      animation: fadeInScale 2s ease-in-out forwards;
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.1);
      }
    }
  </style>
</head>
<body>

  <div class="logo">OffiSuite</div>

</body>
</html>
