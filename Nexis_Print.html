<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexis Print</title>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 解析ライブラリ (Word / Excel プレビュー用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --brand-yellow-main: #FFD700;
            --brand-yellow-light: #FFFF00;
            --brand-yellow-dark: #ccac00;
            --ribbon-bg: #fdfdfd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            overflow: hidden;
        }

        .brand-gradient {
            background: linear-gradient(135deg, var(--brand-yellow-main) 0%, var(--brand-yellow-light) 100%);
        }

        /* リボンUI & ツールバー */
        .ribbon-bar {
            background-color: var(--ribbon-bg);
            border-bottom: 1px solid #d1d5db;
        }

        .ribbon-tab {
            padding: 4px 16px;
            font-weight: 600;
            color: #4b5563;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .ribbon-tab.active {
            color: #854d0e;
            border-bottom-color: #eab308;
            background-color: #fefce8;
        }

        .toolbar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 10px;
            border-radius: 4px;
            color: #374151;
            font-size: 11px;
            transition: background 0.1s;
        }

        .toolbar-btn:hover {
            background-color: #fef08a;
            color: #713f12;
        }

        .ribbon-separator {
            width: 1px;
            height: 28px;
            background-color: #e5e7eb;
            margin: 0 4px;
        }

        /* 印刷用紙プレビュー */
        .paper-preview {
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            transform-origin: top center;
        }

        .paper-a4-portrait {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
        }

        .paper-a4-landscape {
            width: 297mm;
            min-height: 210mm;
            padding: 20mm;
        }

        /* 画面印刷時のCSS調整 */
        @media print {
            header, footer, #view-home, .no-print {
                display: none !important;
            }
            body, #view-workspace {
                background: white !important;
                overflow: visible !important;
                height: auto !important;
            }
            .paper-preview {
                box-shadow: none !important;
                padding: 0 !important;
                width: 100% !important;
                transform: scale(1) !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col select-none">

    <!-- 1. ヘッダー (タイトルバー & リボンツールバー) -->
    <header class="flex-none">
        <!-- A. タイトルバー -->
        <div class="brand-gradient border-b border-yellow-400 h-10 px-3 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 font-black text-yellow-950 tracking-wider text-sm">
                    <i class="fa-solid fa-print text-base"></i>
                    <span>Nexis Print</span>
                </div>
                <span class="text-yellow-800/40 text-xs">|</span>
                <span id="doc-title" class="text-xs font-semibold text-yellow-950 truncate max-w-md">ドキュメント未読み込み</span>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="triggerPrint()" class="px-4 py-1.5 bg-yellow-400 hover:bg-yellow-300 text-yellow-950 font-bold rounded shadow transition flex items-center gap-2 text-xs">
                    <i class="fa-solid fa-print"></i> 印刷する
                </button>
            </div>
        </div>

        <!-- B. リボンバー / ツールバー -->
        <div class="ribbon-bar border-t border-yellow-200">
            <!-- リボンタブ -->
            <div class="flex items-center gap-1 px-3 bg-gray-50/80 border-b border-gray-200">
                <button onclick="switchTab(this, 'tab-home')" class="ribbon-tab active text-xs">ホーム</button>
                <button onclick="switchTab(this, 'tab-printer')" class="ribbon-tab text-xs">プリンター接続 (USB/BT/Wi-Fi)</button>
                <button onclick="switchTab(this, 'tab-page')" class="ribbon-tab text-xs">ページ・表示設定</button>
            </div>

            <!-- タブ 1: ホーム -->
            <div id="tab-home" class="ribbon-tab-content p-2 flex items-center gap-2 overflow-x-auto">
                <button onclick="openFilePicker()" class="toolbar-btn">
                    <i class="fa-solid fa-folder-open text-amber-600 text-lg"></i>
                    <span>ファイルを開く</span>
                </button>
                <button onclick="triggerPrint()" class="toolbar-btn bg-yellow-100/80 border border-yellow-300">
                    <i class="fa-solid fa-print text-yellow-700 text-lg"></i>
                    <span>即時印刷</span>
                </button>
                <div class="ribbon-separator"></div>
                <button onclick="setOrientation('portrait')" class="toolbar-btn">
                    <i class="fa-solid fa-file text-gray-600 text-lg"></i>
                    <span>縦向き</span>
                </button>
                <button onclick="setOrientation('landscape')" class="toolbar-btn">
                    <i class="fa-solid fa-file-lines text-gray-600 text-lg rotate-90"></i>
                    <span>横向き</span>
                </button>
                <div class="ribbon-separator"></div>
                <button onclick="adjustZoom(0.1)" class="toolbar-btn">
                    <i class="fa-solid fa-magnifying-glass-plus text-gray-600 text-lg"></i>
                    <span>拡大</span>
                </button>
                <button onclick="adjustZoom(-0.1)" class="toolbar-btn">
                    <i class="fa-solid fa-magnifying-glass-minus text-gray-600 text-lg"></i>
                    <span>縮小</span>
                </button>
                <button onclick="resetZoom()" class="toolbar-btn">
                    <i class="fa-solid fa-expand text-gray-600 text-lg"></i>
                    <span>100% リセット</span>
                </button>
            </div>

            <!-- タブ 2: プリンター接続 -->
            <div id="tab-printer" class="ribbon-tab-content p-2 hidden flex items-center gap-2 overflow-x-auto">
                <button onclick="useSystemPrinter()" class="toolbar-btn">
                    <i class="fa-solid fa-desktop text-blue-600 text-lg"></i>
                    <span>OS標準印刷</span>
                </button>
                <div class="ribbon-separator"></div>
                <button onclick="connectUSBPrinter()" class="toolbar-btn">
                    <i class="fa-brands fa-usb text-amber-600 text-lg"></i>
                    <span>USBプリンター検知</span>
                </button>
                <button onclick="connectBluetoothPrinter()" class="toolbar-btn">
                    <i class="fa-brands fa-bluetooth-b text-blue-500 text-lg"></i>
                    <span>Bluetooth検索</span>
                </button>
                <button onclick="searchWifiPrinter()" class="toolbar-btn">
                    <i class="fa-solid fa-wifi text-green-600 text-lg"></i>
                    <span>Wi-Fi / IP指定</span>
                </button>
            </div>

            <!-- タブ 3: ページ・表示設定 -->
            <div id="tab-page" class="ribbon-tab-content p-2 hidden flex items-center gap-2 overflow-x-auto">
                <div class="flex items-center gap-2 text-xs text-gray-700 px-2">
                    <span class="font-semibold">用紙サイズ:</span>
                    <select class="border border-gray-300 rounded p-1 text-xs bg-white">
                        <option>A4 (210 x 297 mm)</option>
                        <option>A3 (297 x 420 mm)</option>
                        <option>B5 (182 x 257 mm)</option>
                        <option>Letter (8.5 x 11 inch)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. メインビュー領域 -->
    <!-- ホーム画面 (ファイルドロップ・参照専用) -->
    <section id="view-home" class="flex-1 overflow-y-auto p-8 flex flex-col items-center justify-center">
        <div class="max-w-xl w-full bg-white/90 backdrop-blur rounded-2xl p-8 border border-yellow-200 shadow-xl text-center">
            <div class="w-20 h-20 brand-gradient rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md border border-yellow-400">
                <i class="fa-solid fa-print text-4xl text-yellow-950"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800 mb-1">Nexis Print</h1>
            <p class="text-xs text-gray-500 mb-6">ドキュメントの印刷と直接プレビューを行います</p>

            <!-- ドロップゾーン -->
            <div id="drop-zone" onclick="openFilePicker()" class="border-2 border-dashed border-yellow-400 hover:border-yellow-600 bg-yellow-50/50 hover:bg-yellow-100/50 rounded-2xl p-10 cursor-pointer transition flex flex-col items-center justify-center gap-3 mb-6">
                <i class="fa-solid fa-cloud-arrow-up text-5xl text-yellow-600"></i>
                <div>
                    <p class="font-bold text-gray-800 text-sm">ここにファイルをドラッグ＆ドロップ</p>
                    <p class="text-xs text-gray-500 mt-1">またはクリックしてファイルを参照</p>
                </div>
            </div>

            <!-- サポート拡張子バッジ -->
            <div class="flex flex-wrap justify-center gap-2 text-[11px]">
                <span class="px-2.5 py-1 bg-yellow-100 rounded border border-yellow-300 font-semibold text-yellow-900">.edoc</span>
                <span class="px-2.5 py-1 bg-green-100 rounded border border-green-300 font-semibold text-green-900">.spcell</span>
                <span class="px-2.5 py-1 bg-orange-100 rounded border border-orange-300 font-semibold text-orange-900">.tslide</span>
                <span class="px-2.5 py-1 bg-purple-100 rounded border border-purple-300 font-semibold text-purple-900">.nnote</span>
                <span class="px-2.5 py-1 bg-blue-100 rounded border border-blue-300 font-semibold text-blue-900">.docx / .xlsx / .pptx</span>
                <span class="px-2.5 py-1 bg-gray-100 rounded border border-gray-300 font-semibold text-gray-800">.txt</span>
            </div>
        </div>
    </section>

    <!-- プレビュー ワークスペース -->
    <main id="view-workspace" class="flex-1 overflow-auto p-8 flex justify-center items-start bg-gray-300/60 hidden">
        <div id="paper-container" class="paper-preview paper-a4-portrait">
            <div id="print-area" class="w-full h-full text-gray-900 leading-relaxed text-sm">
                <!-- コンテンツ描画エリア -->
            </div>
        </div>
    </main>

    <!-- 3. ステータスバー -->
    <footer class="bg-gray-100 border-t border-gray-300 h-6 px-3 flex items-center justify-between text-[11px] text-gray-600 select-none">
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
                <span class="font-medium">準備完了</span>
            </span>
            <span class="text-gray-300">|</span>
            <span id="printer-info" class="text-gray-600 font-semibold">出力先: OS標準プリンター</span>
        </div>
        <div>
            <span id="zoom-percentage">100%</span>
        </div>
    </footer>

    <!-- 非表示ファイルインプット -->
    <input type="file" id="file-input" class="hidden" accept=".edoc,.spcell,.tslide,.nnote,.nxdbase,.docx,.xlsx,.pptx,.txt,image/*" onchange="handleFileSelect(event)">

    <!-- Wi-Fi IP指定モーダル -->
    <div id="wifi-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl border border-yellow-300 max-w-sm w-full overflow-hidden">
            <div class="brand-gradient p-3.5 flex items-center justify-between border-b border-yellow-400">
                <h3 class="font-bold text-yellow-950 flex items-center gap-2 text-xs">
                    <i class="fa-solid fa-wifi"></i> ネットワークプリンター IP指定
                </h3>
                <button onclick="closeWifiModal()" class="text-yellow-950 hover:bg-yellow-400/50 p-1 rounded">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-gray-700 mb-1">プリンター IPアドレス</label>
                    <input type="text" id="wifi-ip-input" placeholder="例: 192.168.1.100" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-yellow-400 outline-none">
                </div>
            </div>
            <div class="p-3 bg-gray-50 border-t border-gray-200 flex justify-end gap-2">
                <button onclick="closeWifiModal()" class="px-3 py-1.5 border border-gray-300 rounded text-xs font-semibold hover:bg-gray-100">キャンセル</button>
                <button onclick="confirmWifiPrinter()" class="px-3 py-1.5 brand-gradient text-yellow-950 rounded text-xs font-bold shadow">設定</button>
            </div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        let currentZoom = 1.0;
        let activePrinter = { name: "OS標準プリンター", type: "system" };

        // 起動時初期化 (sessionStorage連携)
        window.addEventListener('DOMContentLoaded', () => {
            const storedFile = sessionStorage.getItem('NEXIS_OFFICE_FILE');
            if (storedFile) {
                try {
                    const parsed = JSON.parse(storedFile);
                    loadNexisData(parsed, "Nexis_Document.edoc");
                } catch (e) {}
            }
        });

        // リボンタブ切替
        function switchTab(btn, tabId) {
            document.querySelectorAll('.ribbon-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.ribbon-tab-content').forEach(c => c.classList.add('hidden'));

            btn.classList.add('active');
            document.getElementById(tabId).classList.remove('hidden');
        }

        // ファイルダイアログ
        function openFilePicker() {
            document.getElementById('file-input').click();
        }

        // ドラッグ＆ドロップ
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                dropZone.classList.add('bg-yellow-200/50', 'border-yellow-600');
            });
        });
        ['dragleave', 'drop'].forEach(name => {
            dropZone.addEventListener(name, (e) => {
                e.preventDefault();
                dropZone.classList.remove('bg-yellow-200/50', 'border-yellow-600');
            });
        });
        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) processFile(files[0]);
        });

        function handleFileSelect(e) {
            if (e.target.files.length > 0) processFile(e.target.files[0]);
        }

        // ファイル解析・表示切替
        function processFile(file) {
            const fileName = file.name;
            const ext = fileName.split('.').pop().toLowerCase();

            document.getElementById('doc-title').textContent = fileName;
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-workspace').classList.remove('hidden');

            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '<div class="flex items-center justify-center h-64 text-gray-500"><i class="fa-solid fa-spinner fa-spin text-2xl mr-2"></i> ドキュメントを読み込み中...</div>';

            const reader = new FileReader();

            // 1. Nexis 独自形式 (.edoc, .spcell, .tslide, .nnote, .nxdbase)
            if (['edoc', 'spcell', 'tslide', 'nnote', 'nxdbase'].includes(ext)) {
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        loadNexisData(json, fileName);
                    } catch(err) {
                        renderTextContent(e.target.result);
                    }
                };
                reader.readAsText(file);
            }
            // 2. テキスト (.txt)
            else if (ext === 'txt') {
                reader.onload = function(e) { renderTextContent(e.target.result); };
                reader.readAsText(file);
            }
            // 3. MS Word (.docx)
            else if (ext === 'docx') {
                reader.onload = function(e) {
                    mammoth.convertToHtml({arrayBuffer: e.target.result})
                        .then(result => { printArea.innerHTML = `<div class="prose max-w-none">${result.value}</div>`; })
                        .catch(err => { printArea.innerHTML = `<div class="text-red-600 p-4">.docx エラー: ${err.message}</div>`; });
                };
                reader.readAsArrayBuffer(file);
            }
            // 4. MS Excel (.xlsx)
            else if (ext === 'xlsx') {
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const html = XLSX.utils.sheet_to_html(firstSheet);
                    printArea.innerHTML = `<div class="overflow-x-auto">${html}</div>`;
                    const table = printArea.querySelector('table');
                    if (table) table.className = "min-w-full border-collapse border border-gray-300 text-xs";
                };
                reader.readAsArrayBuffer(file);
            }
            // 5. 画像ファイル
            else if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp'].includes(ext)) {
                reader.onload = function(e) {
                    printArea.innerHTML = `<div class="flex justify-center items-center h-full"><img src="${e.target.result}" class="max-w-full max-h-[250mm] object-contain"></div>`;
                };
                reader.readAsDataURL(file);
            }
            else {
                reader.onload = function(e) { renderTextContent(e.target.result); };
                reader.readAsText(file);
            }
        }

        // Nexis データ表示
        function loadNexisData(json, filename) {
            const printArea = document.getElementById('print-area');
            if (json.app === 'Nexis Exdocs' || json.content) {
                printArea.innerHTML = `<div class="prose max-w-none">${json.content || json.html || ''}</div>`;
            } else if (json.slides) {
                let html = '';
                json.slides.forEach((slide, idx) => {
                    html += `<div class="border p-4 mb-4 rounded bg-white"><div class="text-xs text-gray-400 mb-2">Slide ${idx+1}</div>${slide.content || ''}</div>`;
                });
                printArea.innerHTML = html;
            } else {
                renderTextContent(JSON.stringify(json, null, 2));
            }
        }

        function renderTextContent(text) {
            document.getElementById('print-area').innerHTML = `<pre class="whitespace-pre-wrap font-mono text-xs leading-relaxed text-gray-800">${escapeHtml(text)}</pre>`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 印刷動作
        function triggerPrint() {
            if (activePrinter.type === 'system') {
                window.print();
            } else {
                alert(`プリンター [${activePrinter.name}] にデータを送信しています...`);
            }
        }

        // レイアウト / ズーム調整
        function setOrientation(mode) {
            const paper = document.getElementById('paper-container');
            if (mode === 'landscape') {
                paper.classList.remove('paper-a4-portrait');
                paper.classList.add('paper-a4-landscape');
            } else {
                paper.classList.remove('paper-a4-landscape');
                paper.classList.add('paper-a4-portrait');
            }
        }

        function adjustZoom(delta) {
            currentZoom = Math.max(0.4, Math.min(1.6, currentZoom + delta));
            document.getElementById('paper-container').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-percentage').textContent = `${Math.round(currentZoom * 100)}%`;
        }

        function resetZoom() {
            currentZoom = 1.0;
            document.getElementById('paper-container').style.transform = `scale(1.0)`;
            document.getElementById('zoom-percentage').textContent = `100%`;
        }

        // プリンター切替・ダイレクト接続
        function useSystemPrinter() {
            activePrinter = { name: "OS標準プリンター", type: "system" };
            document.getElementById('printer-info').textContent = "出力先: OS標準プリンター";
        }

        async function connectUSBPrinter() {
            if ('usb' in navigator) {
                try {
                    const device = await navigator.usb.requestDevice({ filters: [] });
                    activePrinter = { name: device.productName || "USB Printer", type: "usb", device };
                    document.getElementById('printer-info').textContent = `出力先: USB (${activePrinter.name})`;
                    alert(`USBプリンター [${activePrinter.name}] が接続されました。`);
                } catch(e) {}
            } else { alert("お使いのブラウザは WebUSB API 未対応です。"); }
        }

        async function connectBluetoothPrinter() {
            if ('bluetooth' in navigator) {
                try {
                    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: ['printer'] });
                    activePrinter = { name: device.name || "Bluetooth Printer", type: "bluetooth", device };
                    document.getElementById('printer-info').textContent = `出力先: Bluetooth (${activePrinter.name})`;
                    alert(`Bluetoothプリンター [${activePrinter.name}] とペアリングされました。`);
                } catch(e) {}
            } else { alert("お使いのブラウザは Web Bluetooth API 未対応です。"); }
        }

        function searchWifiPrinter() { document.getElementById('wifi-modal').classList.remove('hidden'); }
        function closeWifiModal() { document.getElementById('wifi-modal').classList.add('hidden'); }
        function confirmWifiPrinter() {
            const ip = document.getElementById('wifi-ip-input').value;
            if (ip) {
                activePrinter = { name: `IP Printer (${ip})`, type: "wifi", ip };
                document.getElementById('printer-info').textContent = `出力先: Network (${ip})`;
                closeWifiModal();
            }
        }
    </script>
</body>
</html>
